<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spatial Museum QA</title><style>body{margin:0;background:#c8cec9;font:14px Arial}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap}select{font:inherit;padding:7px}main{overflow:auto}iframe{display:block;border:0;margin:auto;max-width:none}</style></head><body><header><strong>Spatial Museum QA</strong><label>Width<select id="width"><option>320</option><option selected>390</option><option>768</option><option>1440</option></select></label><label>View<select id="route"><option>entrance</option><option>rotunda</option><option>gallery</option><option>interactive</option><option>gallery/last-signal</option><option>interactive/light-study</option></select></label><label>Text<select id="text"><option>100</option><option>200</option></select></label><label>Motion<select id="motion"><option value="normal">Normal</option><option value="reduce">Reduced</option></select></label><label>Scripts<select id="scripts"><option value="on">On</option><option value="off">Off / fallback</option></select></label></header><button id="profile">Run 6s rapid-scroll profile</button><pre id="result" style="white-space:pre-wrap"></pre><main><iframe id="viewport" title="Spatial museum viewport" width="390" height="844" src="./?profile=1&qa=289f396fe59f"></iframe></main><script>const f=document.querySelector('iframe'),w=document.querySelector('#width'),r=document.querySelector('#route'),t=document.querySelector('#text'),m=document.querySelector('#motion'),s=document.querySelector('#scripts');document.querySelector('#profile').onclick=async()=>{const out=document.querySelector('#result');out.textContent='Measuring four forward/back scroll cycles…';try{out.textContent=JSON.stringify(await f.contentWindow.museumProfile.run(),null,2)}catch(e){out.textContent=e.message}};w.onchange=()=>{f.width=w.value;f.height=({320:740,390:844,768:1024,1440:900})[w.value]};s.onchange=()=>{if(s.value==='off')f.setAttribute('sandbox','allow-same-origin');else f.removeAttribute('sandbox');f.src='./?profile=1&qa=289f396fe59f&view='+r.value+'&scripts='+s.value+'#'+r.value;};r.onchange=()=>f.src='./?profile=1&qa=289f396fe59f&view='+r.value+'&scripts='+s.value+'#'+r.value;function apply(){if(f.contentDocument){f.contentDocument.documentElement.style.fontSize=t.value+'%';f.contentWindow.dispatchEvent(new CustomEvent('museum-qa',{detail:{motion:m.value}}));}}t.onchange=apply;m.onchange=apply;f.addEventListener('load',apply);</script></body></html>
